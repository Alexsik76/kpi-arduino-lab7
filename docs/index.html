<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Robot Vision Control</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="monitor">
        <article>
            <header>
                <nav>
                    <ul>
                        <li><strong>👁️ Robot Eye v2.0</strong></li>
                    </ul>
                    <ul>
                        <li>
                            <small id="status-text">Connecting...</small>
                            <span id="status-dot" class="status-dot off"></span>
                        </li>
                    </ul>
                </nav>
            </header>

            <div class="stream-box" id="video-container">
                <div class="offline-msg" id="placeholder">Connecting to Neural Core...</div>
            </div>

            <footer>
                <div class="grid">
                    <button class="secondary outline" onclick="checkSystem()">Ping System</button>
                    <a href="https://robot.lab.vn.ua/docs" target="_blank" role="button" class="contrast outline">API Docs</a>
                </div>
            </footer>
        </article>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
