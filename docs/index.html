<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot Vision Control</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="monitor">
      <article>
        <header>
          <nav>
            <ul>
              <li>
                <label>
                  <input
                    type="checkbox"
                    id="manual-mode-toggle"
                    onchange="toggleManualMode()"
                  />
                  Manual Mode
                </label>
              </li>
              <li>
                <small id="status-text">Connecting...</small>
                <span id="status-dot" class="status-dot off"></span>
              </li>
            </ul>
          </nav>
        </header>

        <div class="stream-box" id="video-container">
          <div class="offline-msg" id="placeholder">
            Connecting to Neural Core...
          </div>
        </div>

        <!-- Manual Controls UI -->
        <div id="manual-controls" style="display: none; padding: 10px">
          <div class="grid">
            <!-- Platform Control (WASD) -->
            <div>
              <h4>Platform <small>(WASD)</small></h4>
              <div class="control-grid">
                <div></div>
                <button
                  onmousedown="setInput('forward', true)"
                  onmouseup="setInput('forward', false)"
                  ontouchstart="setInput('forward', true)"
                  ontouchend="setInput('forward', false)"
                  title="Forward (W)"
                >
                  ▲
                </button>
                <div></div>
                <button
                  onmousedown="setInput('left', true)"
                  onmouseup="setInput('left', false)"
                  ontouchstart="setInput('left', true)"
                  ontouchend="setInput('left', false)"
                  title="Left (A)"
                >
                  ◀
                </button>
                <button
                  onmousedown="setInput('backward', true)"
                  onmouseup="setInput('backward', false)"
                  ontouchstart="setInput('backward', true)"
                  ontouchend="setInput('backward', false)"
                  title="Backward (S)"
                >
                  ▼
                </button>
                <button
                  onmousedown="setInput('right', true)"
                  onmouseup="setInput('right', false)"
                  ontouchstart="setInput('right', true)"
                  ontouchend="setInput('right', false)"
                  title="Right (D)"
                >
                  ▶
                </button>
              </div>
            </div>

            <!-- Servo Control -->
            <div>
              <h4>Camera <small>(Arrows)</small></h4>
              <div class="control-grid">
                <div></div>
                <button
                  onmousedown="setInput('camUp', true)"
                  onmouseup="setInput('camUp', false)"
                  ontouchstart="setInput('camUp', true)"
                  ontouchend="setInput('camUp', false)"
                  title="Up (ArrowUp)"
                >
                  ▲
                </button>
                <div></div>
                <button
                  onmousedown="setInput('camLeft', true)"
                  onmouseup="setInput('camLeft', false)"
                  ontouchstart="setInput('camLeft', true)"
                  ontouchend="setInput('camLeft', false)"
                  title="Left (ArrowLeft)"
                >
                  ◀
                </button>
                <button
                  onmousedown="setInput('camDown', true)"
                  onmouseup="setInput('camDown', false)"
                  ontouchstart="setInput('camDown', true)"
                  ontouchend="setInput('camDown', false)"
                  title="Down (ArrowDown)"
                >
                  ▼
                </button>
                <button
                  onmousedown="setInput('camRight', true)"
                  onmouseup="setInput('camRight', false)"
                  ontouchstart="setInput('camRight', true)"
                  ontouchend="setInput('camRight', false)"
                  title="Right (ArrowRight)"
                >
                  ▶
                </button>
              </div>
              <br />
              <button class="outline" onclick="centerCamera()">
                Cam to Center 
              </button>
            </div>
          </div>
          <p
            style="
              text-align: center;
              margin-top: 10px;
              font-size: 0.8rem;
              opacity: 0.7;
            "
          >
            ⌨️ Use <b>WASD</b> to move robot, <b>Arrow Keys</b> to look around.
          </p>
        </div>

        <footer>
          <div class="grid">
            <button class="secondary outline" onclick="checkSystem()">
              Ping System
            </button>
            <a
              href="https://robot.lab.vn.ua/docs"
              target="_blank"
              role="button"
              class="contrast outline"
              >API Docs</a
            >
          </div>
        </footer>
      </article>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
