<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot Console</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    
    <main class="console-layout">
      
      <section class="side-panel left">
        <h4 class="panel-title">Platform</h4>
        
        <div class="d-pad">
          <div></div>
          <button data-action="forward" title="Forward">W</button>
          <div></div>
          
          <button data-action="left" title="Left">A</button>
          <button data-action="backward" title="Backward">S</button>
          <button data-action="right" title="Right">D</button>
        </div>
        
        <small class="key-hint">WASD</small>
      </section>

      <section class="center-screen">
        
        <header class="hud-header">
            <div class="toggles">
                <label>
                    <input type="checkbox" id="manual-mode-toggle" /> 
                    Manual Mode
                </label>

                <label>
                    <input type="checkbox" id="local-mode-toggle" /> 
                    Local Network
                </label>
            </div>
            
            <div class="status">
                <span id="status-dot" class="status-dot off"></span>
                <small id="status-text">DISCONNECTED</small>
            </div>
        </header>

        <div class="viewport" id="video-container">
            <div class="offline-placeholder" id="placeholder">
                NO SIGNAL
            </div>
        </div>
      </section>

      <section class="side-panel right">
        <h4 class="panel-title">Camera</h4>
        
        <div class="d-pad">
          <div></div>
          <button data-action="camUp" title="Up">▲</button>
          <div></div>
          
          <button data-action="camLeft" title="Left">◀</button>
          <button data-action="camDown" title="Down">▼</button>
          <button data-action="camRight" title="Right">▶</button>
        </div>
        
        <button id="btn-center-cam" class="btn-center" title="Reset Camera Position">
            ⟲ Center
        </button>
        
        <small class="key-hint">Arrows</small>
      </section>

    </main>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
